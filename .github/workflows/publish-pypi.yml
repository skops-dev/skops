# Releases skops end to end. Start it from the "Actions" tab, on the main branch,
# with the version to release: "0.16.0" for a new minor release, "0.16.1" for a
# bug fix release from the existing 0.16.X branch. See the "Releases" section of
# CONTRIBUTING.rst for the whole procedure.
#
# The build job is read-only and also runs for dry runs, from any branch or
# fork. Everything that writes (pushing the release branch, publishing, tagging,
# opening the follow-up pull request) happens in later jobs that never run for a
# dry run. The jobs that publish use the "publish-pypi" environment, which
# requires a maintainer to approve them, so the run pauses before publishing to
# TestPyPI and again before publishing to PyPI.
#
# This file keeps the name publish-pypi.yml because the trusted publishers
# configured on PyPI and TestPyPI are bound to the workflow file name and to the
# "publish-pypi" environment. Renaming either of them breaks publishing.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. "0.16.0" (new minor) or "0.16.1" (bug fix)'
        required: true
        type: string
      dry_run:
        description: "Only build and check: don't push, publish, tag or open a PR"
        required: false
        default: false
        type: boolean

# Never run two releases at the same time.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    # An explicit bash enables `pipefail`, so a failing command before `| tee`
    # fails the step.
    shell: bash

env:
  VERSION: ${{ inputs.version }}
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

permissions: {}

jobs:
  build:
    name: Check and build the release
    runs-on: ubuntu-latest
    permissions:
      # Read-only: this job runs for dry runs too.
      contents: read
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      tag: ${{ steps.meta.outputs.tag }}
      is_patch: ${{ steps.meta.outputs.is_patch }}
      next_minor: ${{ steps.meta.outputs.next_minor }}
      base: ${{ steps.branch.outputs.base }}

    steps:
      - name: Check that this run may release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A release is started from main in skops-dev/skops, so that this
          # workflow and the release script come from main and a new minor release
          # is cut from main. Only a dry run may come from anywhere, e.g. a fork or
          # a branch that changes this workflow, since it writes nothing.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing is pushed or published."
          elif [ "$GITHUB_REPOSITORY" != "skops-dev/skops" ]; then
            echo "::error::Only dry runs are possible on a fork ($GITHUB_REPOSITORY)."
            exit 1
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::A release must be started from main, not from $GITHUB_REF_NAME."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # All branches, to find an existing release branch.
          fetch-depth: 0
          # This job pushes nothing, so the token has no business in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The release branch may predate the script, so every job uses this copy
      # from the branch the workflow was started from, never the copy on the
      # release branch.
      - name: Keep the release script from this branch
        run: cp scripts/release.py "$RUNNER_TEMP/release.py"

      - uses: actions/upload-artifact@v7
        with:
          name: release-script
          path: ${{ runner.temp }}/release.py
          if-no-files-found: error

      - name: Derive the branch, tag and changelog section from the version
        id: meta
        run: python "$RUNNER_TEMP/release.py" meta "$VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Check that the version is not on PyPI yet
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --retry 3 "https://pypi.org/pypi/skops/$VERSION/json")
          if [ "$status" != "404" ]; then
            echo "::error::Expected HTTP 404 for skops $VERSION on PyPI but got" \
              "$status: the version is released already, or PyPI is not reachable."
            exit 1
          fi

      - name: Check out the release branch
        id: branch
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          IS_PATCH: ${{ steps.meta.outputs.is_patch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Releasing from the existing branch $BRANCH"
            git switch "$BRANCH"
          elif [ "$IS_PATCH" = "true" ]; then
            echo "::error::A bug fix release $VERSION needs an existing $BRANCH branch."
            exit 1
          else
            echo "Releasing from $GITHUB_REF_NAME; the push job cuts $BRANCH from it"
          fi
          # The push job makes sure that it starts from this same commit.
          echo "base=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Check that the changelog has a section for this release
        run: python "$RUNNER_TEMP/release.py" check-changelog "$VERSION"

      - name: Set the version
        run: |
          python "$RUNNER_TEMP/release.py" set-version "$VERSION"
          git diff

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import os

          import skops
          import skops.io

          assert skops.__version__ == os.environ["VERSION"], skops.__version__
          assert skops.io.loads(skops.io.dumps([1, 2, 3])) == [1, 2, 3]
          print("skops", skops.__version__, "works")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  push:
    name: Push the release branch
    needs: build
    # The same conditions as the first step of the build job, so that the write
    # token is only ever available to a release started from main.
    if: >-
      ${{ !inputs.dry_run
          && github.repository == 'skops-dev/skops'
          && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # To push the release branch.
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-script
          path: ${{ runner.temp }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check out or cut the release branch
        env:
          BRANCH: ${{ needs.build.outputs.branch }}
          BASE: ${{ needs.build.outputs.base }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git switch "$BRANCH"
          else
            echo "Cutting $BRANCH from $GITHUB_REF_NAME ($GITHUB_SHA)"
            git switch --create "$BRANCH"
          fi
          # The package was built from this commit plus the version change.
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            echo "::error::$BRANCH moved to $(git rev-parse HEAD) since the build" \
              "job used it at $BASE; start the release again."
            exit 1
          fi

      - name: Set the version, commit and push
        id: commit
        env:
          BRANCH: ${{ needs.build.outputs.branch }}
        run: |
          python "$RUNNER_TEMP/release.py" set-version "$VERSION"
          # Nothing to commit when re-running a release whose branch was pushed.
          if ! git diff --quiet; then
            git commit --all --message "REL set version to $VERSION"
          fi
          git log --oneline -1
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  testpypi:
    name: Publish to TestPyPI
    # Skipped along with the push job for dry runs.
    needs: [build, push]
    runs-on: ubuntu-latest
    environment:
      name: publish-pypi
      url: https://test.pypi.org/project/skops/${{ inputs.version }}/
    permissions:
      # Mandatory for trusted publishing, and all this job needs: it does not
      # check out the repository, it only uses the artifacts of the build job.
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-script
          path: ${{ runner.temp }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run after a failure further down must not fail here. The next
          # step makes sure that what is on TestPyPI is what this run built.
          skip-existing: true

      - name: Check that the files on TestPyPI are the ones built by this run
        run: |
          python "$RUNNER_TEMP/release.py" verify-upload "$VERSION" \
            --index-url https://test.pypi.org dist/*

      - name: Smoke test the TestPyPI release
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          python="$RUNNER_TEMP/smoke/bin/python"
          # Only the skops wheel comes from TestPyPI, without dependencies: anyone
          # can upload anything there, so TestPyPI must never be an index for
          # resolving dependencies. The index needs a moment to pick up a new
          # release, so retry for a few minutes.
          for attempt in $(seq 1 10); do
            if "$python" -m pip download --quiet --no-deps --only-binary :all: \
                --index-url https://test.pypi.org/simple/ \
                --dest "$RUNNER_TEMP/testpypi" "skops==$VERSION"; then
              break
            fi
            if [ "$attempt" = 10 ]; then
              echo "::error::Could not download skops==$VERSION from TestPyPI."
              exit 1
            fi
            echo "skops $VERSION is not on TestPyPI yet, retrying in 30 seconds"
            sleep 30
          done
          # Dependencies are resolved from PyPI only, the default index.
          "$python" -m pip install --quiet "$RUNNER_TEMP"/testpypi/skops-*.whl
          "$python" - <<'EOF'
          import os

          import skops
          import skops.io

          assert skops.__version__ == os.environ["VERSION"], skops.__version__
          assert skops.io.loads(skops.io.dumps([1, 2, 3])) == [1, 2, 3]
          print("skops", skops.__version__, "from TestPyPI works")
          EOF

  pypi:
    name: Publish to PyPI, tag and create the GitHub release
    needs: [build, push, testpypi]
    runs-on: ubuntu-latest
    environment:
      name: publish-pypi
      url: https://pypi.org/project/skops/${{ inputs.version }}/
    permissions:
      # Mandatory for trusted publishing.
      id-token: write
      # To push the tag and create the release.
      contents: write

    steps:
      # The release commit, to tag it. Before the artifact downloads: checking
      # out cleans the workspace.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.push.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-script
          path: ${{ runner.temp }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Check that the files on PyPI are the ones built by this run
        run: python "$RUNNER_TEMP/release.py" verify-upload "$VERSION" dist/*

      # Tagging after publishing means a failed upload never leaves a tag behind.
      - name: Tag the release
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes "Changelog: https://skops.readthedocs.io/en/$TAG/changes.html"

  post-release:
    name: Start the next development version
    needs: [build, pypi]
    # A bug fix release comes from an existing release branch and leaves main alone.
    if: ${{ needs.build.outputs.is_patch == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      # To push the branch and open the pull request.
      contents: write
      pull-requests: write
    env:
      NEXT_MINOR: ${{ needs.build.outputs.next_minor }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-script
          path: ${{ runner.temp }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Bump the version and add a changelog section on a new branch
        id: bump
        run: |
          # Branch off the current tip of main, which may have moved on while the
          # release waited for approvals.
          git fetch origin main
          git switch --create "start-$NEXT_MINOR.dev0" FETCH_HEAD
          python "$RUNNER_TEMP/release.py" start-dev "$NEXT_MINOR" | tee -a "$GITHUB_OUTPUT"
          git diff

      - name: Open a pull request
        if: ${{ steps.bump.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DEV: ${{ steps.bump.outputs.version }}
          NEXT_SECTION: ${{ steps.bump.outputs.section }}
        run: |
          branch="start-$NEXT_DEV"
          git commit --all --message "MNT start new version $NEXT_DEV"
          git push origin "HEAD:refs/heads/$branch"
          body="Follow-up to the $VERSION release: set the version on \`main\` to"
          body="$body \`$NEXT_DEV\` and add an empty \`$NEXT_SECTION\` section to the changelog."
          if ! gh pr create --base main --head "$branch" \
              --title "MNT start new version $NEXT_DEV" --body "$body"; then
            echo "::error::Could not open the pull request. Is 'Allow GitHub Actions" \
              "to create and approve pull requests' enabled in the repository" \
              "settings, or does a pull request for $branch exist already? The" \
              "branch is pushed, so the pull request can be opened by hand:" \
              "https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
            exit 1
          fi

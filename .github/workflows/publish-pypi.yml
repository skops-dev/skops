# Publishes a release when a tag like v0.16.0 is pushed: build, TestPyPI, PyPI,
# GitHub release. See the "Releases" section of CONTRIBUTING.rst. Both publish
# jobs use the "publish-pypi" environment, which requires a maintainer to
# approve them.
#
# This file keeps the name publish-pypi.yml because the trusted publishers
# configured on PyPI and TestPyPI are bound to the workflow file name and to the
# "publish-pypi" environment. Renaming either of them breaks publishing.
name: Release

on:
  push:
    tags: ["v*"]
  # Only builds and checks, e.g. to try changes to this workflow on a branch.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check that the wheel installs and that the tag matches its version
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --no-deps dist/*.whl
          # -I keeps the checkout off sys.path, so the wheel is what is imported.
          version=$("$RUNNER_TEMP/venv/bin/python" -I -c "import skops; print(skops.__version__)")
          echo "Built skops $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version in skops/__init__.py."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    if: github.ref_type == 'tag' && github.repository == 'skops-dev/skops'
    runs-on: ubuntu-latest
    environment:
      name: publish-pypi
      url: https://test.pypi.org/project/skops/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running the workflow for the same tag must not fail here.
          skip-existing: true

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: publish-pypi
      url: https://pypi.org/project/skops/
    permissions:
      id-token: write
      # To create the GitHub release.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

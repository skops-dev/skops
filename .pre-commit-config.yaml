repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        exclude: .github/conda/meta.yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
        exclude: skops/card/tests/examples
    -   id: check-case-conflict
    -   id: check-merge-conflict
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.6
    hooks:
    -   id: ruff-check
        args: ["--fix", "--output-format=full"]
    -   id: ruff-format
-   repo: https://github.com/facebook/pyrefly-pre-commit
    # Pyrefly version. The hook runs `pyrefly check` on the whole project, using
    # the [tool.pyrefly] section in pyproject.toml.
    rev: 1.2.0
    hooks:
    -   id: pyrefly-check
        name: pyrefly (type checking)
        # pytest is installed so that pyrefly knows e.g. `pytest.skip` never returns.
        additional_dependencies: [pytest==9.1.1]
